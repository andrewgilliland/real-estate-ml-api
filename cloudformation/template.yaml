AWSTemplateFormatVersion: "2010-09-09"
Description: "Real Estate ML API - Lambda Deployment"

Parameters:
  ModelBucketName:
    Type: String
    Default: real-estate-ml-models
    Description: S3 bucket name for storing ML models

  DeployLambdaResources:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to 'true' after uploading lambda-package.zip and sklearn-layer.zip to S3

Conditions:
  ShouldDeployLambda: !Equals [!Ref DeployLambdaResources, "true"]

Resources:
  # S3 Bucket for Model Storage
  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ModelBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ModelAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt ModelBucket.Arn
                  - !Sub "${ModelBucket.Arn}/*"

  # Lambda Function
  RealEstateMLFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldDeployLambda
    DependsOn:
      - ModelBucket
      - ScikitLearnLayer
    Properties:
      FunctionName: real-estate-ml-api
      Runtime: python3.11
      Handler: app.lambda_handler.handler
      Code:
        S3Bucket: !Ref ModelBucketName
        S3Key: lambda-package.zip
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          MODEL_BUCKET: !Ref ModelBucketName
          MODEL_KEY: models/regressor.pkl
          METADATA_KEY: models/metadata.json
      Layers:
        - !Ref ScikitLearnLayer

  # Lambda Layer for scikit-learn
  ScikitLearnLayer:
    Type: AWS::Lambda::LayerVersion
    Condition: ShouldDeployLambda
    DependsOn: ModelBucket
    Properties:
      LayerName: sklearn-only
      Description: scikit-learn only (pandas/numpy in main package)
      Content:
        S3Bucket: !Ref ModelBucketName
        S3Key: layers/sklearn-layer.zip
      CompatibleRuntimes:
        - python3.11

  # API Gateway REST API
  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Condition: ShouldDeployLambda
    Properties:
      Name: RealEstateMLAPI
      ProtocolType: HTTP
      Description: Real Estate ML API Gateway

  # API Gateway Integration
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: ShouldDeployLambda
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt RealEstateMLFunction.Arn
      PayloadFormatVersion: "2.0"

  # API Gateway Route
  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: ShouldDeployLambda
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: "ANY /{proxy+}"
      Target: !Sub "integrations/${ApiIntegration}"

  # API Gateway Default Route
  ApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: ShouldDeployLambda
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: "ANY /"
      Target: !Sub "integrations/${ApiIntegration}"

  # API Gateway Stage
  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: ShouldDeployLambda
    Properties:
      ApiId: !Ref ApiGateway
      StageName: prod
      AutoDeploy: true

  # Lambda Permission for API Gateway
  LambdaPermission:
    Type: AWS::Lambda::Permission
    Condition: ShouldDeployLambda
    Properties:
      FunctionName: !Ref RealEstateMLFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*"

Outputs:
  ApiUrl:
    Condition: ShouldDeployLambda
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod"

  ModelBucketName:
    Description: S3 bucket for ML models
    Value: !Ref ModelBucket

  LambdaFunctionName:
    Condition: ShouldDeployLambda
    Description: Lambda function name
    Value: !Ref RealEstateMLFunction
